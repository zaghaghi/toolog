[package]
name = "toolog-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The toolog desktop application and CLI entry point"

[lints]
workspace = true

# ADR-0007: one artifact. This binary is both the resident menu-bar app and the
# CLI; which one runs is decided by argv.
[[bin]]
name = "toolog"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
toolog-core.workspace = true
toolog-cli.workspace = true
toolog-ingest.workspace = true
toolog-otlp.workspace = true
toolog-llm.workspace = true

tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true

clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
ts-rs.workspace = true

[features]
# The second opinion (Phase 13). Forwarded to the crates that own it, and on by
# default: the released binary runs a model, and a feature the release depends
# on has to be the one CI builds. `--no-default-features` is task 13.19's
# reserved fallback — it drops llama.cpp and its C++ toolchain entirely, and the
# window then says so rather than offering a card that cannot work.
default = ["inference"]
inference = ["toolog-cli/inference", "toolog-llm/inference"]
