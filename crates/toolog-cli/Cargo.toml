[package]
name = "toolog-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Command implementations for the toolog CLI surface"

[lints]
workspace = true

[dependencies]
toolog-core.workspace = true
toolog-ingest.workspace = true
toolog-otlp.workspace = true
toolog-llm.workspace = true

clap.workspace = true
serde.workspace = true
ts-rs.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
jiff.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
prost.workspace = true

[features]
# Forwarded rather than redeclared: the C++ toolchain requirement belongs to
# `toolog-llm`, and this crate only needs to know whether there is an engine to
# drive. On by default so CI compiles `analysis.rs` — the egress test lives in
# this crate, and it has to run with llama.cpp actually in the graph.
default = ["inference"]
inference = ["toolog-llm/inference"]
